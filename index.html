<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        #chat-box { width: 300px; height: 400px; border: 1px solid #ccc; overflow-y: scroll; margin: auto; padding: 10px; }
        input, button { margin: 5px; }
    </style>
</head>
<body>
    <h2>Simple Chat App</h2>
    <div id="login">
        <input type="text" id="username" placeholder="Enter your name">
        <button onclick="enterChat()">Enter</button>
    </div>
    <div id="chat" style="display:none;">
        <div id="chat-box"></div>
        <input type="text" id="message" placeholder="Type a message">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const binId = "67acfaaead19ca34f800efd2";  // Replace with your JSONBin.io bin ID
        const apiKey = "$2a$10$ASQR8t2H6iwvLzHUEbQ4SO2p4ycdYO3KNkjLRnzaOkVi119FGJh8W"; // Replace with your API Key
        const apiUrl = `https://api.jsonbin.io/v3/b/${binId}`;

        let username = localStorage.getItem("username");

        function enterChat() {
            username = document.getElementById("username").value;
            if (username) {
                localStorage.setItem("username", username);
                document.getElementById("login").style.display = "none";
                document.getElementById("chat").style.display = "block";
                loadMessages();
            }
        }

       async function loadMessages() {
    const res = await fetch(apiUrl, { headers: { "X-Master-Key": apiKey } });
    const data = await res.json();

    console.log("Fetched data:", data); // Debugging output

    // Check where the messages array is located
    const messages = data.record && Array.isArray(data.record) ? data.record : [];

    document.getElementById("chat-box").innerHTML = messages.map(msg => 
        `<p><strong>${msg.user}:</strong> ${msg.text}</p>`
    ).join("");
}

      async function sendMessage() {
    const text = document.getElementById("message").value;
    if (!text) return;

    const res = await fetch(apiUrl, { headers: { "X-Master-Key": apiKey } });
    const data = await res.json();

    console.log("Before update:", data); // Debugging output

    // Ensure data.record is an array
    let messages = data.record;
    if (!Array.isArray(messages)) {
        messages = []; // Reset if it’s not an array
    }

    messages.push({ user: username, text });

    console.log("Updated messages:", messages); // Debugging output

    await fetch(apiUrl, {
        method: "PUT",
        headers: { "X-Master-Key": apiKey, "Content-Type": "application/json" },
        body: JSON.stringify(messages)
    });

    document.getElementById("message").value = "";
    loadMessages();
}

        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
